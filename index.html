function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}


async function typeLine(line){

  const row = document.createElement("div");

  row.className = "terminal-line " + line.type;

  terminal.appendChild(row);

  for(let i = 0; i < line.text.length; i++){

    row.textContent += line.text.charAt(i);

    await sleep(line.speed);

  }

  await sleep(140);
}


async function startBoot(){

  terminal.innerHTML = "";

  boot.classList.remove("hidden");

  portfolio.classList.remove("ready");

  /*
     Pequeña pausa inicial para que se vea
     claramente el arranque.
  */

  await sleep(300);


  for(const line of bootLines){

    await typeLine(line);

  }


  /*
     PORTAFOLIO LISTO ✓ permanece visible
     un momento antes de hacer la transición.
  */

  await sleep(900);


  boot.classList.add("hidden");


  await sleep(650);


  portfolio.classList.add("ready");

}


/* =========================================================
   REINICIAR
========================================================= */

function restartBoot(){

  window.scrollTo({
    top: 0,
    behavior: "auto"
  });

  startBoot();

}

window.addEventListener("load", function(){

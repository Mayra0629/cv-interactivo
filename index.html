<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mayra Barbosa | Ingeniera en Sistemas Computacionales</title>

<meta name="description"
content="Mayra Elizabeth Barbosa Salas — Ingeniera en Sistemas Computacionales, especialista en soporte técnico, redes, telecomunicaciones, infraestructura y datos.">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#05050a;
    color:#f4f4f5;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    overflow-x:hidden;
}

button,
a{
    font-family:inherit;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================================================
   BOOT TERMINAL
========================================================= */

#boot{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    padding:20px;

    transition:
        opacity .65s ease,
        visibility .65s ease;
}

#boot.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.terminal-window{
    width:min(920px,100%);
    height:min(620px,88vh);

    background:#020204;

    border:1px solid #24242d;

    border-radius:12px;

    box-shadow:
        0 0 80px rgba(125,55,255,.12),
        inset 0 0 50px rgba(255,255,255,.015);

    overflow:hidden;

    display:flex;
    flex-direction:column;
}

.terminal-top{
    height:42px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:0 15px;

    border-bottom:1px solid #1b1b22;

    background:#09090d;
}

.terminal-dot{
    width:11px;
    height:11px;
    border-radius:50%;

    margin-right:7px;

    background:#30303a;
}

.terminal-title{
    margin-left:12px;

    color:#666673;

    font-size:12px;
    letter-spacing:1px;
}

#terminal{
    flex:1;

    padding:24px;

    overflow:hidden;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size:14px;
    line-height:1.8;

    white-space:pre-wrap;

    color:#a7a7b3;
}

.terminal-line{
    min-height:1.8em;
}

.terminal-line.prompt{
    color:#ffffff;
}

.terminal-line.info{
    color:#8f8f9b;
}

.terminal-line.success{
    color:#8df7cf;
    text-shadow:0 0 10px rgba(90,255,190,.15);
}

@media(max-width:600px){

    #boot{
        padding:10px;
    }

    .terminal-window{
        height:90vh;
        border-radius:9px;
    }

    .terminal-top{
        height:38px;
    }

    #terminal{
        padding:17px;
        font-size:12px;
        line-height:1.75;
    }
}


/* =========================================================
   PORTFOLIO
========================================================= */

#portfolio{
    opacity:0;
    visibility:hidden;
    transform:translateY(35px);

    transition:
        opacity .8s ease,
        transform .8s ease,
        visibility .8s ease;
}

#portfolio.ready{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}


/* =========================================================
   BACKGROUND
========================================================= */

#portfolio::before{
    content:"";

    position:fixed;
    inset:0;

    z-index:-3;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(109,40,217,.20),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(34,211,238,.12),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(236,72,153,.08),
            transparent 30%
        );

    pointer-events:none;
}

#portfolio::after{
    content:"";

    position:fixed;
    inset:0;

    z-index:-2;

    opacity:.22;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 90%
    );

    pointer-events:none;
}


/* =========================================================
   NAV
========================================================= */

nav{
    position:sticky;
    top:0;

    z-index:1000;

    backdrop-filter:blur(18px);

    background:rgba(5,5,10,.72);

    border-bottom:1px solid rgba(255,255,255,.07);
}

.nav-inner{
    width:min(1180px,92%);
    margin:auto;

    min-height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.logo{
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:#9b5cff;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:22px;

    color:#a1a1aa;

    font-size:13px;
}

.nav-links a{
    transition:.25s;
}

.nav-links a:hover{
    color:#fff;
}

.nav-button{
    border:1px solid rgba(155,92,255,.5);

    background:
        linear-gradient(
            135deg,
            rgba(109,40,217,.25),
            rgba(34,211,238,.08)
        );

    color:#fff;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    transition:.25s;
}

.nav-button:hover{
    border-color:#9b5cff;

    box-shadow:
        0 0 20px rgba(155,92,255,.25);
}

@media(max-width:760px){

    .nav-inner{
        min-height:60px;
    }

    .nav-links{
        display:none;
    }
}


/* =========================================================
   GLOBAL
========================================================= */

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:90px 0;
}

.section-label{
    color:#9b5cff;

    font-size:12px;
    font-weight:800;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:14px;
}

.section-title{
    font-size:clamp(30px,5vw,48px);

    line-height:1.05;

    letter-spacing:-1.8px;

    margin-bottom:18px;
}

.section-description{
    max-width:720px;

    color:#92929d;

    line-height:1.8;

    font-size:16px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:calc(100vh - 68px);

    display:flex;
    align-items:center;

    padding:90px 0 70px;

    position:relative;
}

.hero-grid{
    display:grid;

    grid-template-columns:
        minmax(0,1.25fr)
        minmax(300px,.75fr);

    gap:70px;

    align-items:center;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 12px;

    border:1px solid rgba(34,211,238,.22);

    background:rgba(34,211,238,.04);

    color:#8beaf5;

    border-radius:100px;

    font-size:11px;

    letter-spacing:1.4px;

    margin-bottom:24px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#22d3ee;

    box-shadow:
        0 0 12px #22d3ee;
}

.hero h1{
    font-size:
        clamp(
            50px,
            9vw,
            105px
        );

    line-height:.9;

    letter-spacing:-6px;

    margin-bottom:25px;

    font-weight:900;
}

.gradient-text{
    background:
        linear-gradient(
            100deg,
            #ffffff 5%,
            #b68cff 40%,
            #22d3ee 80%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.hero-role{
    font-size:
        clamp(
            20px,
            3vw,
            31px
        );

    line-height:1.25;

    color:#dddde5;

    margin-bottom:22px;
}

.hero-description{
    max-width:700px;

    color:#9797a4;

    line-height:1.8;

    font-size:16px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;

    gap:12px;

    margin-top:32px;
}

.btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    min-height:46px;

    padding:0 19px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.12);

    background:#111118;

    color:#fff;

    cursor:pointer;

    transition:
        transform .2s,
        border .2s,
        box-shadow .2s;
}

.btn:hover{
    transform:translateY(-2px);

    border-color:rgba(155,92,255,.7);

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

.btn-primary{
    border-color:#8b5cf6;

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #9b5cff
        );

    box-shadow:
        0 0 25px rgba(139,92,246,.20);
}

.btn-secondary{
    background:rgba(255,255,255,.025);
}


/* =========================================================
   HERO CARD
========================================================= */

.hero-panel{
    position:relative;

    border:1px solid rgba(155,92,255,.22);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    border-radius:18px;

    padding:25px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.04);
}

.panel-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:24px;

    color:#777783;

    font-family:monospace;

    font-size:11px;
}

.panel-status{
    color:#70e8bb;
}

.panel-code{
    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:12px;

    line-height:2;

    color:#92929e;
}

.panel-code .purple{
    color:#b28aff;
}

.panel-code .cyan{
    color:#5de5f3;
}

.panel-code .green{
    color:#76e7ba;
}

.panel-code .white{
    color:#fff;
}

.panel-line{
    height:1px;

    background:rgba(255,255,255,.06);

    margin:18px 0;
}

.panel-footer{
    display:flex;
    justify-content:space-between;

    color:#666672;

    font-size:11px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-top:70px;
}

.stat{
    padding:24px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.025);

    border-radius:13px;
}

.stat-number{
    font-size:32px;

    font-weight:900;

    color:#fff;
}

.stat-label{
    margin-top:7px;

    color:#777783;

    font-size:11px;

    letter-spacing:1px;

    line-height:1.5;
}

@media(max-width:850px){

    .hero-grid{
        grid-template-columns:1fr;
    }

    .hero{
        padding-top:70px;
    }

    .hero h1{
        letter-spacing:-3px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        padding:18px;
    }

    .stat-number{
        font-size:26px;
    }
}


/* =========================================================
   CARDS
========================================================= */

.card-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;

    margin-top:40px;
}

.card{
    padding:30px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    transition:
        transform .25s,
        border .25s,
        box-shadow .25s;
}

.card:hover{
    transform:translateY(-4px);

    border-color:
        rgba(155,92,255,.35);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.28);
}

.card h3{
    font-size:21px;

    margin-bottom:10px;
}

.card p{
    color:#8d8d99;

    line-height:1.7;
}

@media(max-width:720px){

    .card-grid{
        grid-template-columns:1fr;
    }
}


/* =========================================================
   EXPERIENCE
========================================================= */

.timeline{
    position:relative;

    margin-top:50px;

    padding-left:30px;
}

.timeline::before{
    content:"";

    position:absolute;

    left:6px;
    top:0;
    bottom:0;

    width:1px;

    background:
        linear-gradient(
            to bottom,
            #9b5cff,
            rgba(155,92,255,.05)
        );
}

.timeline-item{
    position:relative;

    padding:0 0 45px 30px;
}

.timeline-item::before{
    content:"";

    position:absolute;

    left:-30px;
    top:4px;

    width:11px;
    height:11px;

    border-radius:50%;

    background:#9b5cff;

    box-shadow:
        0 0 18px rgba(155,92,255,.8);
}

.timeline-date{
    color:#22d3ee;

    font-family:monospace;

    font-size:12px;

    margin-bottom:9px;
}

.timeline-title{
    font-size:23px;

    margin-bottom:4px;
}

.timeline-company{
    color:#9b5cff;

    margin-bottom:14px;

    font-weight:700;
}

.timeline-item ul{
    list-style:none;

    display:grid;

    gap:7px;
}

.timeline-item li{
    color:#8e8e9a;

    line-height:1.6;
}

.timeline-item li::before{
    content:"→";

    color:#22d3ee;

    margin-right:8px;
}


/* =========================================================
   SKILLS
========================================================= */

.skill-wrapper{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:32px;
}

.skill{
    padding:10px 13px;

    border:1px solid rgba(255,255,255,.09);

    border-radius:8px;

    background:rgba(255,255,255,.025);

    color:#b4b4bf;

    font-size:13px;

    transition:.2s;
}

.skill:hover{
    color:#fff;

    border-color:
        rgba(34,211,238,.35);

    background:
        rgba(34,211,238,.04);
}


/* =========================================================
   PROJECTS
========================================================= */

.projects{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;

    margin-top:45px;
}

.project{
    position:relative;

    overflow:hidden;

    min-height:230px;

    padding:28px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(109,40,217,.10),
            rgba(255,255,255,.018)
        );
}

.project-number{
    font-family:monospace;

    color:#6f6f7a;

    font-size:11px;

    margin-bottom:45px;
}

.project h3{
    font-size:24px;

    margin-bottom:12px;
}

.project p{
    color:#8e8e9a;

    line-height:1.7;
}

.project-tags{
    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:20px;
}

.project-tag{
    color:#8f82bd;

    font-size:10px;

    letter-spacing:.8px;
}

@media(max-width:720px){

    .projects{
        grid-template-columns:1fr;
    }
}


/* =========================================================
   EDUCATION
========================================================= */

.education-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;

    margin-top:40px;
}

.education-card{
    padding:28px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:15px;

    background:
        rgba(255,255,255,.025);
}

.education-year{
    color:#22d3ee;

    font-family:monospace;

    font-size:12px;

    margin-bottom:12px;
}

.education-card h3{
    margin-bottom:7px;
}

.education-card p{

    line-height:1.6;
}

.cert-list{

    gap:10px;
}

.cert{
    padding:14px 16px;

    color:#aaaab5;
}

.cert::before{
    content:"✓";

    color:#75e5b9;

    margin-right:10px;

@media(max-width:720px){

        grid-template-columns:1fr;
    }
}


/* =========================================================
   CONTACT
========================================================= */

.contact{
    position:relative;

    overflow:hidden;

    padding:60px;

    border:
        1px solid
        rgba(155,92,255,.25);

    background:

            rgba(109,40,217,.12),
            rgba(34,211,238,.035)
        );
}

.contact h2{
    font-size:

    margin-bottom:15px;
}

.contact p{
    color:#9696a2;

.contact-actions{

}

   FOOTER
========================================================= */

footer{
    padding:40px 0 55px;

    color:#60606c;

    font-size:12px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    text-align:center;
}


/* =========================================================
   CV PRINT AREA
========================================================= */

#cv-print{
    display:none;
}


/* =========================================================
   PRINT
========================================================= */

@media print{

    body{
        background:#fff !important;
        color:#111 !important;
    }

    body *{
        visibility:hidden !important;
    }

    #cv-print,
    #cv-print *{
        visibility:visible !important;
    }

    #cv-print{
        display:block !important;

        position:absolute;

        left:0;
        top:0;

        width:100%;

        color:#111;

        background:#fff;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size:10.5pt;

        line-height:1.4;
    }

    @page{
        size:A4;
        margin:14mm 15mm;
    }
}
